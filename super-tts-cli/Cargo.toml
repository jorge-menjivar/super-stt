[package]
    name = "super-tts-cli"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Command-line client for the Super TTS daemon (HTTP protocol)"
    repository = "https://github.com/jorge-menjivar/super-tts"
    license = "GPL-3.0-only"

[[bin]]
    name = "super-tts-cli"
    path = "src/main.rs"

[dependencies]
    anyhow.workspace = true
    clap.workspace = true
    super-tts-shared = { path = "../super-tts-shared" }
    tokio = {
        workspace = true,
        features = ["io-util", "macros", "net", "rt-multi-thread"]
    }

[dev-dependencies]
    # Spawns the daemon for the integration tests, in a home of its own.
    super-engine-test-daemon.workspace = true

[lints]
    workspace = true
