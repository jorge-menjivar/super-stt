[package]
    name = "super-tts-app"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Super TTS client application"
    repository = "https://github.com/jorge-menjivar/super-tts"
    license = "GPL-3.0-only"

[dependencies]
    anyhow.workspace = true
    # Microphone capture for cloned-voice reference clips. The app records; the
    # daemon still owns every output device.
    cpal.workspace = true
    dirs.workspace = true
    futures-util.workspace = true
    hound.workspace = true
    i18n-embed.workspace = true
    i18n-embed-fl.workspace = true
    libc.workspace = true
    # COSMIC dependencies
    # Dotted keys, not an inline table: `fluent_language_loader!` parses this
    # manifest with a TOML 1.0 parser, which rejects a multi-line inline table.
    libcosmic.workspace = true
    libcosmic.features = [
        "default",
        "a11y",
        "applet",
        "dbus-config",
        "multi-window",
        "single-instance",
        "tokio",
        "wayland",
        "wgpu",
        "winit",
    ]
    log.workspace = true
    open.workspace = true
    rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
    rust-embed.workspace = true
    serde.workspace = true
    serde_json.workspace = true
    # Cosmic settings dependencies
    slab = "0.4"
    slotmap = "1.1"
    super-engine-forge.workspace = true
    super-tts-registry-types = { path = "../super-tts-registry-types" }
    # Workspace dependencies
    super-tts-shared = { path = "../super-tts-shared" }
    tokio.workspace = true
    # Configuration
    toml.workspace = true
    urlencoding = "2.1.3"
    uuid.workspace = true

[build-dependencies]
    vergen.workspace = true

[features]
    default = []

[dev-dependencies]
    mockito = "1.7.2"
    # Test directories that remove themselves.
    tempfile = "3.27.0"

[lints]
    workspace = true
