[package]
    name = "super-voice-install"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Installer and self-updater for Super Voice"
    repository = "https://github.com/jorge-menjivar/super-voice"
    license = "GPL-3.0-only"

[dependencies]
    log.workspace = true
    super-engine-installer.workspace = true
    super-voice-registry-types = { path = "../super-voice-registry-types" }
    # The COSMIC shortcuts' rules, shared with the settings app's Shortcuts page.
    super-voice-shared = { path = "../super-voice-shared" }

# The end-to-end test builds a release tarball and serves it from a mocked
# GitHub.
[dev-dependencies]
    flate2 = "1.1.9"
    hex = "0.4.3"
    mockito = "1"
    ring = "0.17.14"
    serde_json.workspace = true
    tar = "0.4.46"
    tokio.workspace = true

[lints]
    workspace = true
