[package]
    name = "super-stt-install"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Installer and self-updater for Super STT"
    repository = "https://github.com/jorge-menjivar/super-stt"
    license = "GPL-3.0-only"

[dependencies]
    dirs.workspace = true
    log.workspace = true
    super-engine-installer.workspace = true
    super-stt-registry-types = { path = "../super-stt-registry-types" }

# The end-to-end test builds a release tarball and serves it from a mocked
# GitHub.
[dev-dependencies]
    flate2 = "1.1.9"
    hex = "0.4.3"
    mockito = "1"
    ring = "0.17.14"
    serde_json.workspace = true
    tar = "0.4.46"
    tokio.workspace = true

[lints]
    workspace = true
