name: Install E2E

# Real installs of real published releases, gated on the install surface.
#
# This is deliberately NOT part of ci.yml: it only needs to run when the
# install path changes, and a `paths:` filter applies to a whole workflow.
# For the same reason it must NOT be made a required status check — a
# path-filtered workflow that doesn't run leaves a required check pending
# forever and blocks the merge.
#
# What actually runs is super-engine's install-e2e action; see its
# test-install-e2e.sh for the two passes and why the fixture is a
# published release rather than a tarball built here. It is pinned at the same
# rev as the super-engine crates in Cargo.toml.

on:
  pull_request:
    branches: [main]
    paths:
      - install.sh
      - uninstall.sh
      - super-voice-install/**
      # Pins the super-engine crates the installer is built from:
      # super-engine-installer, and super-engine-forge, which it downloads with.
      - Cargo.toml
      - .github/workflows/install-e2e.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - uninstall.sh
      - super-voice-install/**
      # Pins the super-engine crates the installer is built from:
      # super-engine-installer, and super-engine-forge, which it downloads with.
      - Cargo.toml
      - .github/workflows/install-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  install-e2e:
    name: Install E2E (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]

    steps:
      - uses: actions/checkout@v7

      # The test installs the channel's newest published release. Until Super
      # Voice has one there, that release is Super STT's, with none of the
      # super-voice-* assets the test installs and checks for, and install.sh
      # hands it to that release's own installer. There is nothing of Super
      # Voice's to install yet, so the test waits for its first release on the
      # channel. Remove this step with install.sh's hand-over once Super Voice
      # has a stable release.
      - name: Find a Super Voice release on the channel
        id: release
        env:
          CHANNEL: ${{ matrix.channel }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          INSTALL_SH_SOURCE_ONLY=1 source ./install.sh
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          if [ "$CHANNEL" = stable ]; then
            tag=$(resolve_stable_tag "$(gh_api_curl "$api/releases/latest")")
          else
            tag=$(resolve_beta_tag "$(gh_api_curl "$api/releases")")
          fi
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve the newest $CHANNEL release."
            exit 1
          fi
          release=$(gh_api_curl "$api/releases/tags/$tag")
          if jq -e '.assets | any(.name == "super-voice-install-x86_64-unknown-linux-gnu")' \
              <<<"$release" >/dev/null; then
            echo "published=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::The newest $CHANNEL release, $tag, is from before Super Voice. The install test runs once Super Voice has a $CHANNEL release."
            echo "published=false" >>"$GITHUB_OUTPUT"
          fi

      - if: steps.release.outputs.published == 'true'
        uses: super-libre/super-engine/.github/actions/install-e2e@69bcb750c0923b0407572e34bc9739a38eecfdae
        with:
          slug: super-voice
          short-name: voice
          channel: ${{ matrix.channel }}
