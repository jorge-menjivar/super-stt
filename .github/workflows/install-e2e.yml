name: Install E2E

# Real installs of real published releases, gated on the install surface.
#
# This is deliberately NOT part of ci.yml: it only needs to run when the
# install path changes, and a `paths:` filter applies to a whole workflow.
# For the same reason it must NOT be made a required status check — a
# path-filtered workflow that doesn't run leaves a required check pending
# forever and blocks the merge.
#
# What actually runs is super-engine's install-e2e action, shared with Super
# TTS; see its test-install-e2e.sh for the two passes and why the fixture is a
# published release rather than a tarball built here. It is pinned at the same
# rev as the super-engine crates in Cargo.toml.

on:
  pull_request:
    branches: [main]
    paths:
      - install.sh
      - uninstall.sh
      - super-stt-install/**
      # Pins the super-engine crates the installer is built from:
      # super-engine-installer, and super-engine-forge, which it downloads with.
      - Cargo.toml
      - .github/workflows/install-e2e.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - uninstall.sh
      - super-stt-install/**
      # Pins the super-engine crates the installer is built from:
      # super-engine-installer, and super-engine-forge, which it downloads with.
      - Cargo.toml
      - .github/workflows/install-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  install-e2e:
    name: Install E2E (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]

    steps:
      - uses: actions/checkout@v7

      - uses: super-libre/super-engine/.github/actions/install-e2e@3fc63f7125b8136e637fad57400ab4d83f78ae59
        with:
          slug: super-stt
          short-name: stt
          channel: ${{ matrix.channel }}
