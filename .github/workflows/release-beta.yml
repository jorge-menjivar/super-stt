name: Release (Beta)

# Beta channel for the post-protocol-rewrite workspace.
#
# Triggered by any tag containing "beta" (e.g. `v1.0.0-beta.1`,
# `v0.10.0-beta`, etc.) — the convention is semver pre-release
# identifiers per https://semver.org/#spec-item-9. Tags WITHOUT
# `beta` go to the stable workflow (`release.yml`), which builds the
# same binaries.
#
# Differences from release.yml:
#   1. Tarball names get a `-beta` suffix so the two channels can
#      coexist on the same GitHub releases page without colliding
#      (`super-stt-x86_64-unknown-linux-gnu-cpu-beta.tar.gz`).
#   2. The GitHub release is created with `prerelease: true` so
#      install-stable.sh's `/releases/latest` query continues to
#      skip betas. install-beta.sh walks the full release list and
#      picks the newest one whose prerelease flag is true.

on:
  push:
    tags:
      - "v*beta*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  config-compat:
    name: Old config compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-config-compat-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Load old config fixtures
        run: just config-compat

  build-apps:
    name: Build App Binaries (Beta)
    needs: config-compat
    strategy:
      matrix:
        include:
          # Pinned to 22.04 (glibc 2.35) for broad binary compatibility.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-apps-beta-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config

      - name: Build app binary
        run: cargo build --release --target ${{ matrix.target }} --bin super-stt-app

      - name: Build applet binary
        run: cargo build --release --target ${{ matrix.target }} --bin super-stt-cosmic-applet

      - name: Upload app binaries
        uses: actions/upload-artifact@v7
        with:
          name: apps-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/super-stt-app
            target/${{ matrix.target }}/release/super-stt-cosmic-applet

  build-linux:
    name: Build Linux Binaries (Beta)
    needs: build-apps
    strategy:
      matrix:
        include:
          # Native builds (no cross), pinned to 22.04 (glibc 2.35) so the
          # binaries run on older distros, not just the newest. CPU only.
          - target: x86_64-unknown-linux-gnu
            suffix: cpu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            suffix: cpu
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ matrix.suffix }}-beta-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config

      # Build the daemon, CLI, and consent helper in one cargo
      # invocation. `--bin` filters keep the build narrow (apps were
      # already built in `build-apps`).
      - name: Build daemon + CLI + consent helper
        env:
          BUILD_VARIANT: ${{ matrix.suffix }}
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin super-stt-daemon \
            --bin super-stt-cli \
            --bin super-stt-consent

      - name: Download app binaries
        uses: actions/download-artifact@v8
        with:
          name: apps-${{ matrix.target }}
          path: app-binaries

      - name: Create tarball
        run: |
          mkdir -p dist
          # Daemon, CLI, and consent helper (the new layout). The
          # consent helper MUST be in the same directory as the
          # daemon — locate_consent_helper has no PATH fallback.
          cp target/${{ matrix.target }}/release/super-stt-daemon dist/
          cp target/${{ matrix.target }}/release/super-stt-cli dist/
          cp target/${{ matrix.target }}/release/super-stt-consent dist/
          cp app-binaries/super-stt-app dist/
          cp app-binaries/super-stt-cosmic-applet dist/

          # Include systemd service files
          mkdir -p dist/systemd
          cp super-stt-daemon/systemd/super-stt.service dist/systemd/

          mkdir -p dist/resources

          # Include desktop app resources
          cp -r super-stt-app/resources/* dist/resources

          # Include COSMIC applet resources
          cp -r super-stt-cosmic-applet/resources/* dist/resources

          # Remove any extra assets
          rm -rf dist/resources/assets

          # `-beta` suffix isolates this artifact from the stable
          # channel's tarballs (so a future stable release on the
          # same tag doesn't get clobbered).
          tar -czf super-stt-${{ matrix.target }}-${{ matrix.suffix }}-beta.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: super-stt-${{ matrix.target }}-${{ matrix.suffix }}-beta
          path: super-stt-${{ matrix.target }}-${{ matrix.suffix }}-beta.tar.gz

  create-release:
    name: Create Beta Release
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.tar.gz
          draft: false
          # The whole point of this workflow: mark every release it
          # creates as a prerelease so the GitHub API's
          # `/releases/latest` endpoint continues to return only
          # stable releases. install-beta.sh walks the full release
          # list and picks the first `prerelease: true` entry.
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
