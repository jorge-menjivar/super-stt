name: qwen3-asr-backend

on:
  workflow_dispatch:
  push:
    tags: ["qwen3-asr-v*"]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest          # x86_64, no GPU, no CUDA toolkit
    strategy:
      matrix:
        accel: [cpu, cuda13]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8

      - name: Lint, type-check, and test
        working-directory: backends/qwen3-asr
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run pytest -q

      - name: Assemble bundle
        working-directory: backends/qwen3-asr
        run: ./scripts/build_bundle.sh ${{ matrix.accel }} "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v7
        with:
          name: qwen3-asr-${{ matrix.accel }}
          path: ${{ runner.temp }}/out/*.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/out/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gpu-smoke:
    needs: assemble
    runs-on: [self-hosted, gpu, cuda13]   # the cuda13 box; hosted runners have no GPU
    if: needs.assemble.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8

      - uses: actions/download-artifact@v8
        with:
          name: qwen3-asr-cuda13
          path: dl

      - name: Extract + provision 0.6B
        run: |
          mkdir -p be && tar -C be -xzf dl/*.tar.gz
          uv run --no-project --with huggingface_hub -- \
            python -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3-ASR-0.6B', local_dir='be/models/qwen3-asr-0.6b')"

      - name: Smoke test on GPU
        run: |
          export SUPER_STT_BACKEND_DIR="$PWD/be"
          export SUPER_STT_BACKEND_SOCKET="$PWD/be/sock"
          be/bin/qwen3-asr & PID=$!
          sleep 8
          curl --unix-socket be/sock http://x/v1/ping
          curl --unix-socket be/sock -XPOST http://x/v1/load -H 'content-type: application/json' \
               -d '{"name":"qwen3-asr-0.6b","provider":"local_qwen3_asr","device":"cuda"}'
          READY=
          for i in $(seq 1 120); do
            STATE=$(curl -s --unix-socket be/sock http://x/v1/status | python3 -c 'import sys,json;print(json.load(sys.stdin)["state"])')
            [ "$STATE" = "ready" ] && { READY=1; break; }
            [ "$STATE" = "error" ] && { echo "load error"; kill $PID; exit 1; }
            sleep 2
          done
          if [ -z "$READY" ]; then echo "timed out waiting for ready"; kill $PID; exit 1; fi
          curl -s --unix-socket be/sock http://x/v1/status | grep -q '"device":"cuda"' || { echo "device not cuda"; kill $PID; exit 1; }
          kill $PID
