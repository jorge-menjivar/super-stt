# SPDX-License-Identifier: GPL-3.0-only
name: Build registry index

# The job is super-engine's, shared with Super TTS. It is pinned at the same
# rev as the super-engine crates in Cargo.toml.

on:
  schedule:
    - cron: '0 */6 * * *'    # every 6 hours
  push:
    branches: [main]
    paths: ['registry/registry.toml', 'super-stt-registry-types/**']
  workflow_dispatch:

permissions:
  contents: write   # to push to gh-pages branch

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    uses: super-libre/super-engine/.github/workflows/build-index.yml@17a121050a9d52aae21525fe2e801501aae5d3bc
    with:
      indexer: super-stt-indexer
      registry-types: super-stt-registry-types
