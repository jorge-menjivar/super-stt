# SPDX-License-Identifier: GPL-3.0-only
name: Build registry index

on:
  schedule:
    - cron: '0 */6 * * *'    # every 6 hours
  push:
    branches: [main]
    paths: ['registry/registry.toml', 'super-stt-registry-types/**']
  workflow_dispatch:

permissions:
  contents: write   # to push to gh-pages branch

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: src

      - name: Checkout gh-pages (for prior index)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: pages

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/target
          key: build-index-${{ hashFiles('src/Cargo.lock') }}

      - name: Build indexer
        working-directory: src
        run: cargo build --release -p super-stt-indexer

      - name: Run indexer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          src/target/release/super-stt-indexer build \
            --registry src/registry/registry.toml \
            --prior-index pages/index.json \
            --out out/index.json

      - name: Generate schemas
        working-directory: src
        run: cargo run -p super-stt-registry-types --features schema --bin gen_schemas

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Publish from a clean directory so this step never depends on what
          # the best-effort `gh-pages` checkout above left behind. A failed
          # first-run checkout leaves a partial repo on the default branch,
          # which previously made the commit land on `master` and the
          # `gh-pages` push fail with "src refspec gh-pages does not match any".
          rm -rf publish && mkdir publish && cd publish
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # Build the new commit on top of the current gh-pages tip when it
          # exists (fast-forward push, preserves any other published files);
          # on the first run the branch is unborn and this becomes the root.
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git reset --hard -q FETCH_HEAD
          fi
          cp ../out/index.json index.json
          cp ../src/target/schemas/*.json .
          git add -A
          if git diff --cached --quiet; then
            echo "index.json and schemas unchanged; nothing to publish"
            exit 0
          fi
          git -c user.name=actions -c user.email=actions@github.com \
              commit -q -m "Update index.json + schemas ($GITHUB_SHA)"
          git push origin gh-pages
