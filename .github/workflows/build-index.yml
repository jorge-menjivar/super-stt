# SPDX-License-Identifier: GPL-3.0-only
name: Build registry index

# The job is super-engine's, shared with Super TTS. It is pinned at the same
# rev as the super-engine crates in Cargo.toml.

on:
  schedule:
    - cron: '0 */6 * * *'    # every 6 hours
  push:
    branches: [main]
    paths: ['registry/registry.toml', 'super-voice-registry-types/**']
  workflow_dispatch:

permissions:
  contents: write   # to push to gh-pages branch

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    uses: super-libre/super-engine/.github/workflows/build-index.yml@5544d03c528c51a4cc6320f270ff234fb2d8fb1a
    with:
      indexer: super-voice-indexer
      registry-types: super-voice-registry-types
