# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "super-stt-indexer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Cron-driven indexer that builds index.json from registry.toml"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
reqwest = { workspace = true }
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
toml = "1"
url = "2"
super-stt-registry-types = { path = "../super-stt-registry-types" }
super-stt-forge = { version = "0.1.4-beta.2", path = "../super-stt-forge" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"
