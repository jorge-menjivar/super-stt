# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "super-stt-indexer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Cron-driven indexer that builds index.json from registry.toml"

[lints]
workspace = true

[dependencies]
# Shared version pins inherited from [workspace.dependencies].
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
# Indexer-only dependencies (not used elsewhere in the workspace).
flate2 = "1"
futures = "0.3"
hex = "0.4"
ring = "0.17"
semver = "1"
tar = "0.4"
url = "2"
# Workspace path crates.
super-stt-registry-types = { path = "../super-stt-registry-types" }
super-stt-forge = { version = "0.1.4-beta.2", path = "../super-stt-forge" }

[dev-dependencies]
mockito = "1"
tempfile = "3"
