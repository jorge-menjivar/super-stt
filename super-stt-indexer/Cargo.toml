[package]
    name = "super-stt-indexer"
    edition = "2024"
    description = "Cron-driven indexer that builds index.json from registry.toml"
    license = "GPL-3.0-only"

[dependencies]
    anyhow.workspace = true
    chrono.workspace = true
    clap.workspace = true
    env_logger.workspace = true
    flate2 = "1"
    futures = "0.3"
    hex = "0.4"
    log.workspace = true
    reqwest.workspace = true
    ring = "0.17"
    semver = "1"
    serde.workspace = true
    serde_json.workspace = true
    super-engine-forge.workspace = true
    super-stt-registry-types = { path = "../super-stt-registry-types" }
    tar = "0.4"
    thiserror.workspace = true
    tokio.workspace = true
    toml.workspace = true
    url = "2"

[dev-dependencies]
    mockito = "1"
    tempfile = "3"

[lints]
    workspace = true
