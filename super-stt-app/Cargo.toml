[package]
    name = "super-stt-app"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Super STT client application"
    repository = "https://github.com/jorge-menjivar/super-stt"
    license = "GPL-3.0-only"

[dependencies]
    anyhow.workspace = true
    dirs.workspace = true
    futures-util.workspace = true
    i18n-embed.workspace = true
    i18n-embed-fl.workspace = true
    libc.workspace = true
    # COSMIC dependencies: see the two [target.…] tables below, which are
    # where libcosmic itself is declared.
    log.workspace = true
    open.workspace = true
    rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
    rust-embed.workspace = true
    serde.workspace = true
    serde_json.workspace = true
    # Cosmic settings dependencies
    slab = "0.4"
    slotmap = "1.1"
    strum.workspace = true
    strum_macros.workspace = true
    super-stt-forge = { path = "../super-stt-forge" }
    super-stt-registry-types = { path = "../super-stt-registry-types" }
    # Workspace dependencies
    super-stt-shared = { path = "../super-stt-shared" }
    tokio.workspace = true
    # Configuration
    toml.workspace = true
    urlencoding = "2.1.3"
    uuid.workspace = true

# libcosmic, whose feature set is the one dependency that differs by platform.
#
# The Linux list is unchanged. The macOS list drops the five features that are
# Linux-only at the dependency level:
#
#   applet          cosmic-panel-config -> smithay-client-toolkit -> xkbcommon
#                   via pkg-config. The only link in that chain with no
#                   `target_vendor = "apple"` gate, and so the reason a macOS
#                   build failed outright. The settings window is not a panel
#                   applet and never needed it.
#   wayland, x11    The two Linux window backends ("default" turns both on).
#                   macOS renders through winit + wgpu, which libcosmic's
#                   vendored iced fork supports on Apple targets — every
#                   Wayland crate in iced_winit sits behind that same
#                   `not(target_vendor = "apple")` gate.
#   dbus-config     Reads configuration from cosmic-settings-daemon over D-Bus.
#   single-instance Built on zbus. See `main.rs` for what stands in for it.
#
# Dotted keys, not an inline table: `fluent_language_loader!` parses this
# manifest with a TOML 1.0 parser, which rejects a multi-line inline table.
[target.'cfg(target_os = "linux")'.dependencies]
    libcosmic.workspace = true
    libcosmic.features = [
        "default",
        "a11y",
        "applet",
        "dbus-config",
        "multi-window",
        "single-instance",
        "tokio",
        "wayland",
        "wgpu",
        "winit",
    ]

[target.'cfg(not(target_os = "linux"))'.dependencies]
    libcosmic.workspace = true
    libcosmic.features = [
        "a11y",
        "multi-window",
        "tokio",
        "wgpu",
        "winit",
    ]

# The native window frame and menu bar on macOS (src/core/app/macos/): the
# NSWindow is reached through the raw window handle iced hands out, since
# libcosmic passes none of iced's macOS window options through. objc2 and
# objc2-app-kit are the versions libcosmic's own stack already builds, and the
# ones muda (the menu bar) is built on.
[target.'cfg(target_os = "macos")'.dependencies]
    objc2-app-kit.version = "0.3"
    objc2-app-kit.default-features = false
    objc2-app-kit.features = [
        "std",
        "block2",
        "objc2-core-foundation",
        "objc2-quartz-core",
        "NSAccessibility",
        "NSAppearance",
        "NSApplication",
        "NSButton",
        "NSColor",
        "NSColorSpace",
        "NSControl",
        "NSGraphics",
        "NSResponder",
        "NSToolbar",
        "NSView",
        "NSVisualEffectView",
        "NSWindow",
        "NSWorkspace",
    ]
    objc2 = "0.6"
    objc2-foundation.version = "0.3"
    objc2-foundation.default-features = false
    objc2-foundation.features = [
        "std",
        "block2",
        "NSArray",
        "NSDictionary",
        "NSKeyValueObserving",
        "NSNotification",
        "NSOperation",
        "NSString",
        "NSUserDefaults",
    ]
    block2 = "0.6"
    objc2-quartz-core.version = "0.3"
    objc2-quartz-core.default-features = false
    objc2-quartz-core.features = ["std", "objc2-core-foundation", "CALayer"]
    muda.version = "0.20"
    muda.default-features = false
    raw-window-handle = "0.6"

[build-dependencies]
    vergen.workspace = true

[features]
    default = []

[dev-dependencies]
    # The `v1/` wrapper tests drive each call against a fake daemon served on a
    # Unix socket (see `daemon/client/tests/fake_daemon.rs`), so the request the
    # wrapper actually builds is the thing under test. Same HTTP stack the real
    # daemon serves with.
    http-body-util = "0.1"
    hyper = { version = "1", features = ["http1", "server"] }
    hyper-util = { version = "0.1", features = ["tokio"] }
    # Those tests seed the session cache so no call reaches the consent popup.
    # `session::save` writes through to the keyring on its way, which in an
    # automated run must not be the developer's own — so the tests install the
    # in-memory mock builder first.
    keyring.workspace = true
    mockito = "1.7.2"
    # The path and response-key contract tests check the client against the
    # OpenAPI document the daemon builds from its router. Taken from the crate
    # rather than a file so the tests need nothing generated first.
    super-stt-daemon = { path = "../super-stt-daemon" }

[lints]
    workspace = true
