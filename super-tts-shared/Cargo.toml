[package]
    name = "super-tts-shared"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Text to speech's shared types and utilities for Super Voice"

[dependencies]
    anyhow.workspace = true
    log.workspace = true
    # Not the workspace's rubato (5): this resampler is written against 3.
    rubato = { version = "3.0", optional = true }
    serde.workspace = true
    serde_json.workspace = true
    super-engine-client.workspace = true
    super-engine-protocol.workspace = true
    # The daemon's status, which reports both features.
    super-stt-shared = { path = "../super-stt-shared" }
    super-voice-registry-types = { path = "../super-voice-registry-types" }
    thiserror.workspace = true
    utoipa = { workspace = true, optional = true }
    uuid.workspace = true

[features]
    default = []
    analysis = ["super-engine-protocol/analysis"]
    audio = ["rubato"]
    # Derive `utoipa::ToSchema` on the protocol types the daemon publishes in its
    # OpenAPI document. Off by default: only the daemon (and the spec generator)
    # needs it, so the app, applet and CLI don't pay to compile utoipa's derive.
    openapi = [
        "dep:utoipa",
        "super-engine-protocol/openapi",
        "super-voice-registry-types/openapi",
    ]

[lints]
    workspace = true
