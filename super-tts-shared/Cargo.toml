[package]
    name = "super-tts-shared"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Shared types and utilities for Super TTS"

[dependencies]
    anyhow.workspace = true
    async-stream = "0.3.6"
    futures-util.workspace = true
    http-body-util = "0.1"
    hyper = { version = "1", features = ["client", "http1"] }
    hyper-util = {
        version = "0.1",
        features = ["client", "client-legacy", "http1", "tokio"]
    }
    keyring.workspace = true
    log.workspace = true
    rubato = { workspace = true, optional = true }
    serde.workspace = true
    serde_json.workspace = true
    super-engine-client.workspace = true
    super-engine-protocol.workspace = true
    super-engine-spec.workspace = true
    super-tts-registry-types = { path = "../super-tts-registry-types" }
    thiserror.workspace = true
    tokio = {
        workspace = true,
        features = [
            "macros",
            "net",
            "rt-multi-thread",
            "time",
        ]
    }
    utoipa = { workspace = true, optional = true }
    uuid.workspace = true

[features]
    default = []
    analysis = ["super-engine-protocol/analysis"]
    audio = ["rubato"]
    # Derive `utoipa::ToSchema` on the protocol types the daemon publishes in its
    # OpenAPI document. Off by default: only the daemon (and the spec generator)
    # needs it, so the app, applet and CLI don't pay to compile utoipa's derive.
    openapi = [
        "dep:utoipa",
        "super-engine-protocol/openapi",
        "super-tts-registry-types/openapi",
    ]

[lints]
    workspace = true
