[package]
    name = "super-tts-consent"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Floating libcosmic consent dialog spawned by the Super TTS daemon"
    repository = "https://github.com/jorge-menjivar/super-tts"
    license = "GPL-3.0-only"

[[bin]]
    name = "super-tts-consent"
    path = "src/main.rs"

[dependencies]
    # Deliberately lean: no "default", so the helper skips a11y, dbus-config
    # and x11 that the app pulls in. It's a short-lived dialog.
    libcosmic = {
        workspace = true,
        features = [
            "autosize",
            "multi-window",
            "tokio",
            "wayland",
            "winit",
        ]
    }
    libc.workspace = true
    log.workspace = true
    super-tts-shared = { path = "../super-tts-shared" }

[dev-dependencies]
    libc.workspace = true

[lints]
    workspace = true
