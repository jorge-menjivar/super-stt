[package]
name = "super-stt-registry-types"
version.workspace = true
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
description = "Canonical types for backend.toml manifests and registry.toml entries"

[lints]
workspace = true

[dependencies]
schemars = { version = "1", optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
spdx = { version = "0.13.4", default-features = false }
thiserror.workspace = true
toml.workspace = true

[features]
schema = ["dep:schemars", "dep:serde_json"]

[dev-dependencies]
jsonschema = { version = "0.46.5", default-features = false }
serde_json.workspace = true

[[bin]]
name = "gen_schemas"
path = "src/bin/gen_schemas.rs"
required-features = ["schema"]
