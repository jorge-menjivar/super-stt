[package]
    name = "super-stt-cosmic-applet"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Super STT client application"
    repository = "https://github.com/jorge-menjivar/super-stt"
    license = "GPL-3.0-only"

# Single applet binary with command-line arguments
[[bin]]
    name = "super-stt-cosmic-applet"
    path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
    clap = { version = "4.5", features = ["derive"] }
    cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic.git", features = [
        "applet",
        "tokio",
    ] }
    futures-util.workspace = true
    libc.workspace = true
    log.workspace = true
    serde.workspace = true
    serde_json.workspace = true
    super-stt-shared = { path = "../super-stt-shared" }
    tokio.workspace = true
    toml.workspace = true
