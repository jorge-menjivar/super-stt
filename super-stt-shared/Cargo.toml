[package]
    name = "super-stt-shared"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Shared types and utilities for Super STT"

[dependencies]
    # Core shared dependencies
    anyhow.workspace = true
async-stream = "0.3.6"
    chrono.workspace = true
    clap.workspace = true
    cpal = { workspace = true, optional = true }
    # Notification service dependencies
    dashmap.workspace = true
futures-util.workspace = true
    # Audio processing (optional feature)
    hound = { workspace = true, optional = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
keyring.workspace = true
    libc.workspace = true
    log.workspace = true
    rubato = { workspace = true, optional = true }
    serde.workspace = true
    serde_json.workspace = true
    # Audio analysis (optional feature)
    spectrum-analyzer = { workspace = true, optional = true }
    strum.workspace = true
    strum_macros.workspace = true
super-stt-registry-types = { path = "../super-stt-registry-types" }
    thiserror.workspace = true
    tokio = { workspace = true, features = [
        "macros",
        "net",
        "rt-multi-thread",
        "time",
    ] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
    uuid.workspace = true

[features]
    default = []
    analysis = ["spectrum-analyzer"]
    audio = ["cpal", "hound", "rubato"]
