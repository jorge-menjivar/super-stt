[package]
    name = "super-stt-consent"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Floating libcosmic consent dialog spawned by the Super STT daemon"
    repository = "https://github.com/jorge-menjivar/super-stt"
    license = "GPL-3.0-only"

[[bin]]
    name = "super-stt-consent"
    path = "src/main.rs"

[lints]
workspace = true

[dependencies]
    cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = [
        "autosize",
        "multi-window",
        "tokio",
        "wayland",
        "winit",
    ] }
libc.workspace = true
log.workspace = true
super-stt-shared = { version = "0.1.4-beta.2", path = "../super-stt-shared" }

[dev-dependencies]
libc.workspace = true
