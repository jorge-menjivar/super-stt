[package]
    name = "super-stt-daemon"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Super STT cli and daemon service"
    repository = "https://github.com/jorge-menjivar/super-stt"
    license = "GPL-3.0-only"

[dependencies]
    # Core dependencies
    anyhow.workspace = true
    # Daemon-specific utilities
    byteorder.workspace = true
    # ML framework
    candle-core.workspace = true
    candle-nn.workspace = true
    candle-transformers.workspace = true
chrono.workspace = true
    # CLI for daemon
    clap.workspace = true
    cpal.workspace = true
    dashmap.workspace = true
    dirs.workspace = true
    # Input simulation
    enigo.workspace = true
    env_logger.workspace = true
    futures = "0.3"
    # Audio processing
    hound.workspace = true
    keyring.workspace = true
    libc.workspace = true
    log.workspace = true
    parking_lot.workspace = true
    reqwest.workspace = true
    # Hashing for content-addressed blobs
    ring = "0.17"
    rubato.workspace = true
    rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
    rustfft.workspace = true
    serde.workspace = true
    serde_json.workspace = true
    spectrum-analyzer.workspace = true
    strum.workspace = true
    strum_macros.workspace = true
    # Shared crate
    super-stt-shared = { path = "../super-stt-shared", features = [
        "analysis",
        "audio",
    ] }
    symphonia.workspace = true
    tekken-rs.workspace = true
    tiktoken-rs = "0.9.1"
    tokenizers.workspace = true
    tokio = { workspace = true, features = [
        "fs",
        "io-std",
        "io-util",
        "macros",
        "process",
        "rt-multi-thread",
        "signal",
    ] }
    tokio-util.workspace = true
    toml.workspace = true
    uuid.workspace = true
    # D-Bus integration
    zbus.workspace = true
async-trait = "0.1.89"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
base64 = "0.22.1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "http1"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }

[features]
    default = []
    cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
    cudnn = ["candle-core/cudnn"]
    flash-attn = ["candle-transformers/flash-attn"]

[dev-dependencies]
futures-util.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc.workspace = true
