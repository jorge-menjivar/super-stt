[package]
    name = "super-stt-daemon"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Super STT cli and daemon service"
    repository = "https://github.com/jorge-menjivar/super-stt"
    license = "GPL-3.0-only"

[[bin]]
    name = "mock_backend"
    path = "src/bin/mock_backend.rs"
    required-features = ["test-fixtures"]

# Writes docs/protocol/openapi.json from the live `/v1` router. CI runs it
# (`just openapi`) and publishes the result; the file is not committed.
[[bin]]
    name = "gen_openapi"
    path = "src/bin/gen_openapi.rs"

[dependencies]
    # Core dependencies
    anyhow.workspace = true
    async-trait = "0.1.89"
    axum = {
        version = "0.8",
        default-features = false,
        features = ["json", "query", "tokio", "ws"]
    }
    chrono.workspace = true
    clap.workspace = true
    cpal.workspace = true
    dashmap.workspace = true
    dirs.workspace = true
    futures = "0.3"
    hex = "0.4.3"
    http-body-util = "0.1"
    hyper = { version = "1", features = ["http1", "server"] }
    hyper-util = {
        version = "0.1",
        features = ["http1", "server", "server-auto", "tokio"]
    }
    libc.workspace = true
    log.workspace = true
    parking_lot.workspace = true
    reqwest.workspace = true
    # Hashing for content-addressed blobs
    ring = "0.17"
    rubato.workspace = true
    rustls = {
        version = "0.23",
        default-features = false,
        features = ["ring", "std", "tls12"]
    }
    serde.workspace = true
    serde_json.workspace = true
    strum.workspace = true
    strum_macros.workspace = true
    super-engine-daemon = { workspace = true, features = ["beeper"] }
    super-engine-forge.workspace = true
    super-stt-registry-types = { path = "../super-stt-registry-types" }
    # Shared crate
    super-stt-shared = {
        path = "../super-stt-shared",
        features = [
            "analysis",
            "audio",
            # The protocol types the daemon publishes in its OpenAPI document
            # carry their own `ToSchema`, so the spec describes each one where it
            # is defined instead of restating its fields at the router.
            "openapi",
        ]
    }
    thiserror.workspace = true
    tokio = {
        workspace = true,
        features = [
            "fs",
            "io-std",
            "io-util",
            "macros",
            "process",
            "rt-multi-thread",
            "signal",
        ]
    }
    tokio-stream = { version = "0.1.18", features = ["sync"] }
    toml.workspace = true
    urlencoding = "2.1.3"
    utoipa.workspace = true
    utoipa-axum.workspace = true
    uuid.workspace = true

# Linux-only dependencies.
#
# `zbus` is the session bus: the D-Bus event service, the freedesktop
# notification bubbles, and the XDG portal write method all speak it, and
# macOS has no session bus for any of them. `enigo` builds on both platforms
# but reaches the keyboard differently — see the workspace entry for why the
# `wayland` feature is named here rather than there.
[target.'cfg(target_os = "linux")'.dependencies]
    enigo = { workspace = true, features = ["wayland"] }
    zbus.workspace = true

# macOS dependencies.
#
# enigo with no features: on macOS it types through CoreGraphics
# (`CGEventCreateKeyboardEvent`), which needs no feature and no display
# server — only the Accessibility permission, which the user grants once.
[target.'cfg(target_os = "macos")'.dependencies]
    enigo.workspace = true
    # Typing a character at a time (output::keyboard::enigo_backend), with the
    # features and version enigo itself builds.
    objc2-core-graphics.version = "0.3"
    objc2-core-graphics.features = ["CGEventTypes", "CGRemoteOperation"]
    # Finding the app bundle's executable, which posts notifications for the
    # daemon (output::notification_center).
    objc2-foundation = {
        version = "0.3",
        default-features = false,
        features = ["std", "NSBundle", "NSString"],
    }

[dev-dependencies]
    futures-util.workspace = true
    hound.workspace = true
    # Integration tests route their own (client-side) keyring access to the
    # in-memory mock. `session::install_mock_keyring_if_requested` is the
    # production entry point for that, but it is gated on an env var, and
    # setting one from a threaded test process is unsound under edition 2024 —
    # so `tests/common` calls the builder directly. See `common::install_mock_keyring`.
    keyring.workspace = true
    http-body-util = "0.1"
    hyper = { version = "1", features = ["client", "http1"] }
    hyper-util = { version = "0.1", features = ["tokio"] }
    libc.workspace = true
    mockito = "1.7.2"
    # The daemon's own version must parse, for the index `min_client` check.
    semver = "1.0.28"
    tempfile = "3.27.0"
    # `test-util` enables `#[tokio::test(start_paused = true)]`, so tests covering
    # the notice key-release delay assert it without spending it in wall-clock time.
    tokio = { workspace = true, features = ["test-util"] }
    # The realtime smoke tests speak WebSocket to the daemon.
    tokio-tungstenite = {
        version = "0.29.0",
        default-features = false,
        features = ["connect", "rustls-tls-webpki-roots"]
    }
    wiremock = "0.6.5"

[features]
    # Models are served by out-of-tree backends; both transports are on by
    # default. GPU residency now lives in the backend, so the daemon no longer
    # has cuda/cudnn/flash-attn features.
    default = ["subprocess-backends", "wasm-backends"]
    # Spawn STT backends as sandboxed native subprocesses.
    subprocess-backends = ["super-engine-daemon/subprocess"]
    # Build the mock_backend test fixture binary (used by tests/subprocess_mock.rs).
    test-fixtures = ["hyper-util/service"]
    # Load STT backends as sandboxed WASM components.
    wasm-backends = ["super-engine-daemon/wasm"]

[lints]
    workspace = true
