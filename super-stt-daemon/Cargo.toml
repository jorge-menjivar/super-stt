[package]
    name = "super-stt-daemon"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Super STT cli and daemon service"
    repository = "https://github.com/jorge-menjivar/super-stt"
    license = "GPL-3.0-only"

[lints]
workspace = true

[dependencies]
    # Core dependencies
    anyhow.workspace = true
chrono.workspace = true
    # CLI for daemon
    clap.workspace = true
    cpal.workspace = true
    dashmap.workspace = true
    dirs.workspace = true
    # Input simulation
    enigo.workspace = true
    futures = "0.3"
    keyring.workspace = true
    libc.workspace = true
    log.workspace = true
    parking_lot.workspace = true
    reqwest.workspace = true
    # Hashing for content-addressed blobs
    ring = "0.17"
    rubato.workspace = true
    rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
    serde.workspace = true
    serde_json.workspace = true
    strum.workspace = true
    strum_macros.workspace = true
    # Shared crate
    super-stt-shared = { path = "../super-stt-shared", features = [
        "analysis",
        "audio",
    ] }
    tokio = { workspace = true, features = [
        "fs",
        "io-std",
        "io-util",
        "macros",
        "process",
        "rt-multi-thread",
        "signal",
    ] }
    tokio-util.workspace = true
    toml.workspace = true
    uuid.workspace = true
    # D-Bus integration
    zbus.workspace = true
async-trait = "0.1.89"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
base64 = "0.22.1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "ws"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "http1"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
wasmtime = { version = "45.0.0", features = ["async"], optional = true }
wasmtime-wasi = { version = "45.0.0", optional = true }
wasmtime-wasi-http = { version = "45.0.0", optional = true }
bytes = { version = "1.11.1", optional = true }
http-body = { version = "1.0.1", optional = true }
gpu-probe = { git = "https://github.com/jorge-menjivar/gpu-probe", version = "0.1.0" }
semver = "1.0.28"
nvml-wrapper = "0.12"
thiserror.workspace = true
tar = "0.4.46"
flate2 = "1.1.9"
hex = "0.4.3"
ulid = "1.2.1"
urlencoding = "2.1.3"
super-stt-registry-types = { path = "../super-stt-registry-types" }
super-stt-forge = { version = "0.1.4-beta.2", path = "../super-stt-forge" }

[features]
    # Models are served by out-of-tree backends; both transports are on by
    # default. GPU residency now lives in the backend, so the daemon no longer
    # has cuda/cudnn/flash-attn features.
    default = ["subprocess-backends", "wasm-backends"]
    # Spawn STT backends as sandboxed native subprocesses.
    subprocess-backends = ["hyper/client", "dep:bytes"]
    # Load STT backends as sandboxed WASM components.
    wasm-backends = [
        "dep:wasmtime",
        "dep:wasmtime-wasi",
        "dep:wasmtime-wasi-http",
        "dep:bytes",
        "dep:http-body",
    ]
    # Build the mock_backend test fixture binary (used by tests/subprocess_mock.rs).
    test-fixtures = ["hyper-util/service"]

[dev-dependencies]
futures-util.workspace = true
hound.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc.workspace = true
mockito = "1.7.2"
tempfile = "3.27.0"
wiremock = "0.6.5"

[[bin]]
    name = "mock_backend"
    path = "src/bin/mock_backend.rs"
    required-features = ["test-fixtures"]
