# SPDX-License-Identifier: GPL-3.0-only
# Dummy backend manifest with a synthesis model — the text to speech half of
# what `super-voice-registry-types/tests/schema_validation.rs` holds the backend
# schema against (`dummy-backend.toml` is the speech to text half). Not a real
# backend.

[backend]
    source = "github.com/jorge-menjivar/dummy-tts"
    name = "Dummy"
    version = "1.2.3"
    kind = "wasm"
    entrypoint = "dummy.wasm"
    product = "super-voice"
    contract = "v1"
    id = "app.test.dummy-tts"
    description = "Test backend."
    license = "Apache-2.0"

[network]
    allowed_hosts = ["api.example.com"]

[assets]
    wasm = "dummy.wasm"

[[secrets]]
    name = "dummy_api_key"
    description = "API key for the dummy backend."
    required = true

[[models]]
    name = "dummy-online"
    role = "synthesis"
    primary_language = "en"
    supported_languages = ["en"]
    supported_devices = ["none"]

[[models]]
    name = "dummy-local"
    role = "synthesis"
    # Keeps the legacy `provider` key covered: every published backend.toml
    # declares it, and the daemon still echoes it back on `POST /v1/load`.
    provider = "local_dummy"
    primary_language = "en"
    supported_languages = ["en"]
    supported_devices = ["cpu", "cuda"]
