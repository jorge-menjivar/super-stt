#:schema ../../schemas/backend.schema.json
# Mistral backend configuration. See docs/protocol/backend/config.md.

[backend]
    source = "github.com/jorge-menjivar/super-stt/mistral"
    name = "Mistral"
    version = "0.2.0"
    kind = "wasm"
    entrypoint = "mistral.wasm"
    contract = "v1"

[network]
    allowed_hosts = ["api.mistral.ai"]

[capabilities]
    websocket = true

[assets]
    wasm = "mistral.wasm"

[[secrets]]
    name = "mistral_api_key"
    label = "Mistral API key"
    description = "Used to authenticate requests to api.mistral.ai."
    required = true

[[options]]
    name = "base_url"
    label = "API base URL"
    description = "Override the API base URL, e.g. for a gateway."
    type = "string"
    default = "https://api.mistral.ai"

[[models]]
    name = "voxtral-mini-latest"
    provider = "mistral"
    multilingual = true
    primary_language = "en"
    supported_languages = ["en"]
    supported_devices = ["none"]

[[models]]
    name = "voxtral-mini-transcribe-realtime-2602"
    provider = "mistral"
    multilingual = true
    primary_language = "en"
    supported_languages = ["en"]
    supported_devices = ["none"]
    realtime = true
