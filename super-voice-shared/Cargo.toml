[package]
    name = "super-voice-shared"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Super Voice's shared types and utilities, for both features"

[dependencies]
    anyhow.workspace = true
    async-stream = "0.3.6"
    futures-util.workspace = true
    http-body-util = "0.1"
    hyper = { version = "1", features = ["client", "http1"] }
    hyper-util = {
        version = "0.1",
        features = ["client", "client-legacy", "http1", "tokio"]
    }
    log.workspace = true
    rubato = { workspace = true, optional = true }
    # Text to speech's resampler is written against rubato 3, not the
    # workspace's 5.
    rubato3 = { package = "rubato", version = "3.0", optional = true }
    serde.workspace = true
    serde_json.workspace = true
    super-engine-client.workspace = true
    super-engine-protocol.workspace = true
    super-engine-spec.workspace = true
    super-voice-registry-types = { path = "../super-voice-registry-types" }
    thiserror.workspace = true
    tokio = {
        workspace = true,
        features = [
            "macros",
            "net",
            "rt-multi-thread",
            "time",
        ]
    }
    utoipa = { workspace = true, optional = true }
    uuid.workspace = true

# `launch_agents`: registering the app bundle's LaunchAgents with launchd.
[target.'cfg(target_os = "macos")'.dependencies]
    objc2 = "0.6"
    objc2-foundation = {
        version = "0.3",
        default-features = false,
        features = ["std", "NSBundle", "NSError", "NSString"],
    }
    objc2-service-management = {
        version = "0.3",
        default-features = false,
        features = ["std", "SMAppService", "SMErrors", "objc2", "objc2-foundation"],
    }

[features]
    default = []
    analysis = ["super-engine-protocol/analysis"]
    audio = ["rubato", "rubato3"]
    # Derive `utoipa::ToSchema` on the protocol types the daemon publishes in its
    # OpenAPI document. Off by default: only the daemon (and the spec generator)
    # needs it, so the app, applet and CLI don't pay to compile utoipa's derive.
    openapi = [
        "dep:utoipa",
        "super-engine-protocol/openapi",
        "super-voice-registry-types/openapi",
    ]

[lints]
    workspace = true
