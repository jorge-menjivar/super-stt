[workspace]
    resolver = "2"
    members = [
        "super-stt-app",
        "super-stt-cli",
        "super-stt-consent",
        "super-stt-cosmic-applet",
        "super-stt-daemon",
        "super-stt-registry-types",
        "super-stt-shared",
        "super-stt-indexer",
        "super-stt-forge",
    ]
    # The indexer is a host binary, so it's a workspace member — `--workspace`
    # lints and tests it like everything else. But it's a CI-only tool with
    # heavy deps, so keep it out of `default-members`: the everyday
    # `cargo build`/`run`/`test` (no `--workspace`) stays lean.
    default-members = [
        "super-stt-app",
        "super-stt-cli",
        "super-stt-consent",
        "super-stt-cosmic-applet",
        "super-stt-daemon",
        "super-stt-registry-types",
        "super-stt-shared",
        "super-stt-forge",
    ]
    # The mock WASM backend fixtures build for wasm32-wasip2, not the host target
    # (the daemon's wasm_mock.rs / wasm_mock_realtime.rs load them) — keep them
    # out of the workspace entirely.
    exclude = [
        "super-stt-daemon/tests/fixtures/mock-wasm-backend",
        "super-stt-daemon/tests/fixtures/mock-wasm-realtime-backend",
    ]

    [workspace.package]
        version = "0.1.4-beta.2"
        authors = ["Jorge Menjivar <jorge@menjivar.ai>"]
        edition = "2024"

    [workspace.dependencies]
        anyhow = "1.0.100"
        chrono = { version = "0.4", features = ["serde"] }
        clap = { version = "4.5.54", features = ["cargo", "derive"] }
        cpal = "0.17.3"
        dashmap = "6.1.0"
        dirs = "6.0.0"
        # Input simulation (for client)
        enigo = { version = "0.6.1", default-features = false, features = [
            "wayland",
        ] }
        env_logger = "0.11.8"
        futures-util = "0.3.31"
        # Audio processing
        hound = "3.5.1"
        i18n-embed = { version = "0.16.0", features = [
            "desktop-requester",
            "fluent-system",
        ] }
        i18n-embed-fl = "0.10.0"
        keyring = { version = "3", features = ["sync-secret-service"] }
        # System calls (for client singleton)
        libc = "0.2"
        # Cosmic specific
        libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = [
            "a11y",
            "applet",
            "dbus-config",
            "multi-window",
            "single-instance",
            "tokio",
            "wayland",
            "wgpu",
            "winit",
        ] }
        log = "0.4.29"
        open = "5.3.3"
        parking_lot = "0.12"
        reqwest = { version = "0.13.2", default-features = false, features = [
            "json",
            "multipart",
            "rustls-no-provider",
            "stream",
        ] }
        rubato = "0.16"
        rust-embed = "8.11.0"
        serde = { version = "1.0.219", features = ["derive"] }
        serde_json = "1.0.149"
        spectrum-analyzer = "1.7.0"
        strum = { version = "0.28.0", features = ["derive"] }
        strum_macros = "0.28"
        thiserror = "2.0"
        tokio = { version = "1.49.0", features = [
            "full",
            "macros",
            "net",
            "rt-multi-thread",
            "time",
        ] }
        tokio-util = "0.7"
        # Filesystem utilities
        toml = "1.0.6"
        uuid = { version = "1.23.0", features = ["v4"] }
        # Build dependencies
        vergen = { version = "8.3.1", features = ["git", "gitcl"] }
        # D-Bus integration
        zbus = "5.14.0"

    [workspace.metadata.cross.build]
        pre-build = [
            "dpkg --add-architecture $CROSS_DEB_ARCH",
            "apt-get update && apt-get --assume-yes install git libxkbcommon-dev:$CROSS_DEB_ARCH libwayland-dev:$CROSS_DEB_ARCH libxkbcommon-x11-dev:$CROSS_DEB_ARCH libegl1-mesa-dev:$CROSS_DEB_ARCH libfontconfig1-dev:$CROSS_DEB_ARCH libfreetype6-dev:$CROSS_DEB_ARCH libglib2.0-dev:$CROSS_DEB_ARCH libspeechd-dev:$CROSS_DEB_ARCH libxrandr-dev:$CROSS_DEB_ARCH libxinerama-dev:$CROSS_DEB_ARCH libxcursor-dev:$CROSS_DEB_ARCH libxi-dev:$CROSS_DEB_ARCH libxss-dev:$CROSS_DEB_ARCH libasound2-dev:$CROSS_DEB_ARCH  pkg-config libssl-dev:$CROSS_DEB_ARCH libdbus-1-dev:$CROSS_DEB_ARCH",
        ]

        [workspace.metadata.cross.build.env]
            passthrough = ["BUILD_VARIANT", "CUDA_COMPUTE_CAP", "DOCKER_OPTS"]

[profile.release]
    lto = true
    panic = "abort"
    codegen-units = 1
