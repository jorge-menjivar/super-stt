# SPDX-License-Identifier: GPL-3.0-only
# Dummy backend manifest used by the daemon's offline-index end-to-end test and
# for quick manual offline testing (`super-stt-indexer local`). Not a real
# backend — assets are placeholders when generated with --allow-missing-assets.

[backend]
    source = "github.com/jorge-menjivar/dummy"
    name = "Dummy Backend"
    version = "1.2.3"
    kind = "wasm"
    entrypoint = "dummy.wasm"
    contract = "v1"
    license = "GPL-3.0-only"
    description = "A fixture backend for offline registry tests."

[network]
    allowed_hosts = ["api.example.com"]

[assets]
    wasm = "dummy.wasm"

[[secrets]]
    name = "dummy_api_key"
    label = "Dummy API key"
    description = "A fixture secret; never read."
    required = true

[[options]]
    name = "base_url"
    label = "API base URL"
    description = "A fixture option; never read."
    type = "string"
    default = "https://api.example.com"

[[models]]
    name = "dummy-online"
    provider = "openai"
    primary_language = "en"
    supported_languages = ["en"]
    supported_devices = ["none"]

# A free-form provider — `dummy` is not a built-in name, which is exactly what
# the registry now allows.
[[models]]
    name = "dummy-local"
    provider = "dummy"
    primary_language = "en"
    supported_languages = ["en"]
    supported_devices = ["cpu", "cuda"]
