# SPDX-License-Identifier: GPL-3.0-only
# Dummy backend manifest used by the test-index generator's tests and for quick
# manual offline testing. Not a real backend — assets are placeholders when
# generated with --allow-missing-assets.

[backend]
    source = "github.com/jorge-menjivar/dummy"
    name = "Dummy Backend"
    version = "1.2.3"
    kind = "wasm"
    entrypoint = "dummy.wasm"
    contract = "v1"
    license = "GPL-3.0-only"
    description = "A fixture backend for offline registry tests."

[network]
    allowed_hosts = ["api.example.com"]

[assets]
    wasm = "dummy.wasm"

[[secrets]]
    name = "dummy_api_key"
    label = "Dummy API key"
    required = true

[[options]]
    name = "base_url"
    label = "API base URL"
    type = "string"
    default = "https://api.example.com"

[[models]]
    name = "dummy-online"
    provider = "openai"
    supported_devices = ["none"]

[[models]]
    name = "dummy-local"
    provider = "dummy"
    supported_devices = ["cpu", "cuda"]
